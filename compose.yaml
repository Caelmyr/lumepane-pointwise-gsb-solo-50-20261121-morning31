name: solo53-lumepane
services:
  bench:
    build:
      context: .
      args:
        LUMEPANE_DEPS_IMAGE: ${LUMEPANE_DEPS_IMAGE:-python:3.11-slim}
    image: ${LUMEPANE_IMAGE:-solo53-lumepane:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${LUMEPANE_PORT:-19953}:8000"
    volumes:
      - glass-library:/var/lib/lumepane
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  glass-library:
